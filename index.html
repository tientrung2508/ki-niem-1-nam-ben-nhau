<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kỷ Niệm 1 Năm - Báu & Trang</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d11;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Khung máy / Khung tranh */
    .anime-card {
      width: 100%;
      max-width: 420px;
      height: 680px;
      /* Dùng ảnh anime hoàng hôn biển làm nền */
      background: url('http://googleusercontent.com/generated_image_content/0') no-repeat center center/cover;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    /* Lớp phủ độ bóng để chữ và nút dễ nhìn hơn */
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.5) 100%);
    }

    /* Tiêu đề */
    .title {
      position: absolute;
      top: 25px;
      width: 100%;
      text-align: center;
      color: #fff;
      font-size: 1.3rem;
      font-weight: bold;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
      letter-spacing: 1px;
    }

    /* Nút tương tác lãng mạn */
    .controls {
      position: absolute;
      bottom: 30px;
      width: 100%;
      text-align: center;
      z-index: 20;
    }

    .btn-anime {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.7);
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      transition: all 0.3s;
    }

    .btn-anime:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: scale(1.03);
    }

    /* Bức thư tình */
    .letter-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 85%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 30;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .letter-modal.open {
      transform: translate(-50%, -50%) scale(1);
    }

    .letter-modal h2 { color: #e63946; font-size: 1.3rem; margin-bottom: 12px; }
    .letter-modal p { font-size: 0.95rem; color: #333; line-height: 1.6; text-align: left; }

    /* Hiệu ứng Mưa Trái Tim & Đom đóm sáng */
    .heart {
      position: absolute;
      color: #ff4d6d;
      font-size: 22px;
      animation: dropHeart 3s linear infinite;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(255, 77, 109, 0.8);
    }

    @keyframes dropHeart {
      0% { transform: translateY(-20px) scale(0.8); opacity: 1; }
      50% { opacity: 0.9; }
      100% { transform: translateY(700px) scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="anime-card" id="card">
    <div class="overlay"></div>
    <div class="title">Our 1st Anniversary ❤️</div>

    <div class="controls">
      <button id="actionBtn" class="btn-anime" onclick="triggerEffect()">Chạm để tạo bất ngờ ✨</button>
    </div>

    <div id="letter" class="letter-modal">
      <h2>Gửi Trang Yêu Vấu! 💌</h2>
      <p>
        Chúc mừng kỷ niệm 1 năm ngày hai đứa mình bên nhau! <br><br>
        Cảm ơn em đã cùng anh đi qua 365 ngày thật nhiều khoảnh khắc đáng nhớ. Mong rằng hành trình yêu thương của chúng mình sẽ mãi rực rỡ và ấm áp như buổi hoàng hôn này. Yêu em nhiều! ❤️
      </p>
    </div>
  </div>

  <audio id="bgMusic" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

  <script>
    let step = 0;

    function triggerEffect() {
      const btn = document.getElementById('actionBtn');
      const letter = document.getElementById('letter');
      const music = document.getElementById('bgMusic');

      // Tự động bật nhạc
      music.play().catch(() => {});

      if (step === 0) {
        // Kích hoạt hiệu ứng mưa trái tim rơi
        startHeartRain();
        btn.innerText = 'Mở thư tình của anh ✉️';
        step = 1;
      } 
      else if (step === 1) {
        // Hiện thư tình
        letter.classList.add('open');
        btn.style.display = 'none';
      }
    }

    function startHeartRain() {
      const card = document.getElementById('card');
      for (let i = 0; i < 20; i++) {
        setTimeout(() => {
          const heart = document.createElement('div');
          heart.classList.add('heart');
          heart.innerHTML = '💖';
          heart.style.left = Math.random() * 90 + '%';
          heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
          card.appendChild(heart);
        }, i * 150);
      }
    }
  </script>
</body>
</html>
