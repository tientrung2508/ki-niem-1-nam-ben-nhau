<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kỷ Niệm 1 Năm - Báu & Trang</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Khung tranh nghệ thuật */
    .art-card {
      width: 100%;
      max-width: 420px;
      height: 650px;
      /* Phối màu hoàng hôn bãi biển kiểu Ghibli */
      background: linear-gradient(to bottom, #ff7e5f 0%, #feb47b 35%, #ffeccc 60%, #4a90e2 100%);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      border: 2px solid #ffffff40;
    }

    /* Mặt trời hoàng hôn */
    .sun {
      position: absolute;
      top: 180px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, #fff 0%, #ffeb3b 60%, transparent 100%);
      border-radius: 50%;
      box-shadow: 0 0 40px #ffeb3b;
    }

    /* Sóng biển & Bờ cát */
    .ocean {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 250px;
      background: linear-gradient(to bottom, #2b5876 0%, #4e4376 100%);
    }
    .sand {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 120px;
      background: linear-gradient(to bottom, #e2b078 0%, #a87948 100%);
      border-top-left-radius: 50% 20px;
      border-top-right-radius: 50% 20px;
    }

    /* Đồ họa Đôi tình nhân SVG (Bóng silhouettes lãng mạn) */
    .couple-container {
      position: absolute;
      bottom: 70px;
      left: -120px;
      width: 120px;
      transition: all 4s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 5;
    }

    /* Nút bấm tương tác */
    .controls {
      position: absolute;
      bottom: 25px;
      width: 100%;
      text-align: center;
      z-index: 20;
    }

    .btn-romantic {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.6);
      padding: 14px 28px;
      font-size: 1rem;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      transition: all 0.3s;
    }
    .btn-romantic:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    /* Bức thư tình nghệ thuật */
    .letter-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 85%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 30;
    }
    .letter-modal.open {
      transform: translate(-50%, -50%) scale(1);
    }
    .letter-modal h2 { color: #d94b4b; font-size: 1.4rem; margin-bottom: 12px; }
    .letter-modal p { font-size: 0.95rem; color: #444; line-height: 1.6; text-align: left; }

    /* Chim hải âu bay */
    .bird {
      position: absolute;
      color: rgba(255,255,255,0.7);
      font-size: 18px;
      animation: fly 12s linear infinite;
    }
    @keyframes fly {
      from { left: -30px; transform: translateY(0); }
      to { left: 450px; transform: translateY(-30px); }
    }
  </style>
</head>
<body>

  <div class="art-card">
    <div class="sun"></div>
    
    <div class="bird" style="top: 80px; animation-delay: 0s;">🕊️</div>
    <div class="bird" style="top: 120px; animation-delay: -4s;">🕊️</div>

    <div class="ocean"></div>
    <div class="sand"></div>

    <div id="couple" class="couple-container">
      <svg viewBox="0 0 100 120" width="100" height="120">
        <path d="M 30,40 Q 30,20 40,20 Q 50,20 50,40 L 48,70 L 38,110 L 32,110 L 42,70 L 30,70 Z" fill="#2c1e21"/>
        <path d="M 60,45 Q 60,28 68,28 Q 76,28 76,45 L 72,75 L 78,110 L 72,110 L 66,78 L 58,78 Z" fill="#2c1e21"/>
        <path d="M 60,55 L 78,80 L 54,80 Z" fill="#2c1e21"/>
        <path d="M 45,50 Q 52,60 58,52" stroke="#2c1e21" stroke-width="4" fill="none"/>
        <circle cx="26" cy="48" r="6" fill="#ff6b6b"/>
        <circle cx="22" cy="52" r="5" fill="#ffa8a8"/>
        <circle cx="28" cy="54" r="5" fill="#ff8787"/>
      </svg>
    </div>

    <div class="controls">
      <button id="actionBtn" class="btn-romantic" onclick="walkTogether()">Chạm vào đây nè ❤️</button>
    </div>

    <div id="letter" class="letter-modal">
      <h2>Gửi Trang Yêu Vấu! 💌</h2>
      <p>
        Chúc mừng kỷ niệm 1 năm ngày hai đứa mình bên nhau! <br><br>
        Cảm ơn em vì đã đến, cùng anh trải qua 365 ngày thật đẹp. Giống như buổi hoàng hôn ấm áp này, mong rằng chúng mình sẽ tiếp tục nắm tay nhau đi qua thật nhiều chặng đường phía trước nhé! ❤️
      </p>
    </div>
  </div>

  <audio id="bgMusic" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

  <script>
    let step = 0;

    function walkTogether() {
      const couple = document.getElementById('couple');
      const btn = document.getElementById('actionBtn');
      const letter = document.getElementById('letter');
      const music = document.getElementById('bgMusic');

      // Tự động bật nhạc nền
      music.play().catch(() => {});

      if (step === 0) {
        // Cặp đôi dạo bước ra giữa bãi biển
        couple.style.left = 'calc(50% - 50px)';
        btn.innerText = 'Đọc lời chúc của anh ✉️';
        step = 1;
      } 
      else if (step === 1) {
        // Hiện thư tình lãng mạn
        letter.classList.add('open');
        btn.style.display = 'none';
      }
    }
  </script>
</body>
</html>
