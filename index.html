<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kỷ Niệm 1 Năm Bên Nhau</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@300;400;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050508;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #fff;
    }

    /* Khung hiển thị giao diện */
    .container {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 720px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 20px;
    }

    /* 3. Bức ảnh anime phóng to / thu nhỏ mượt mà */
    .bg-image-wrapper {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    .bg-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.85;
      /* Hiệu ứng Zoom in/out liên tục nhẹ nhàng */
      animation: pulseZoom 8s ease-in-out infinite alternate;
      transform-origin: center center;
    }

    @keyframes pulseZoom {
      0% { transform: scale(1); }
      100% { transform: scale(1.12); }
    }

    /* Lớp phủ làm dịu ánh sáng để thấy rõ chữ */
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.7) 100%);
      z-index: 2;
    }

    /* Khu vực hiển thị đếm số ngày và lời nhắn */
    .content-box {
      position: relative;
      z-index: 10;
      text-align: center;
      margin-top: 20px;
    }

    .counter-number {
      font-size: 3.8rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 182, 193, 0.6);
      font-family: 'Montserrat', sans-serif;
    }

    .counter-label {
      font-size: 1.1rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 15px;
      color: #ffe0e6;
      opacity: 0.9;
    }

    .message-text {
      font-family: 'Dancing Script', cursive;
      font-size: 2rem;
      color: #ffccd5;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      opacity: 0;
      transform: translateY(20px);
      transition: all 1.5s ease;
    }

    .message-text.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Nút bắt đầu */
    .start-btn {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      color: #fff;
      padding: 14px 32px;
      font-size: 1rem;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      transition: all 0.4s;
      font-family: 'Montserrat', sans-serif;
    }

    .start-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: scale(1.05);
    }

    /* 2. Hiệu ứng Trái tim rơi xuống */
    .heart-particle {
      position: absolute;
      top: -30px;
      color: #ff4d6d;
      font-size: 20px;
      z-index: 5;
      user-select: none;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(750px) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Hình nền anime với tên file IMG_2288.png -->
    <div class="bg-image-wrapper">
      <img src="IMG_2288.png" class="bg-image" alt="Anime Hoàng Hôn" id="animeBg" onerror="this.src='https://raw.githubusercontent.com/tientrung2508/ki-niem-1-nam-ben-nhau/main/IMG_2288.png'">
    </div>
    <div class="overlay"></div>

    <!-- Nội dung chạy chữ đếm ngày -->
    <div class="content-box">
      <div class="counter-number" id="dayCounter">0</div>
      <div class="counter-label" id="counterLabel">NGÀY</div>
      <div class="message-text" id="finalMessage">Thế là tròn 1 năm 2 đứa bên nhau.. ❤️</div>
    </div>

    <!-- Nút bắt đầu -->
    <button class="start-btn" id="startBtn" onclick="startStory()">Xem kỷ niệm ✨</button>
  </div>

  <!-- Nhạc đúng tên file MP3 trên GitHub -->
  <audio id="bgMusic" loop src="Ed Sheeran - Photograph (Lyrics) - 7clouds.mp3"></audio>

  <script>
    let heartInterval;

    function startStory() {
      const btn = document.getElementById('startBtn');
      const music = document.getElementById('bgMusic');
      
      // Cho nhạc chạy
      music.play().catch(() => {});
      btn.style.display = 'none';

      // 1. Chạy chữ đếm từ 1 đến 365 ngày
      let currentDay = 0;
      const targetDay = 365;
      const counterElement = document.getElementById('dayCounter');
      const messageElement = document.getElementById('finalMessage');

      const counterInterval = setInterval(() => {
        currentDay += 5;
        if (currentDay >= targetDay) {
          currentDay = targetDay;
          clearInterval(counterInterval);

          // Khi đạt 365 ngày -> Hiện dòng chữ
          setTimeout(() => {
            messageElement.classList.add('show');
          }, 300);

          // 2. Kích hoạt hiệu ứng tim rơi
          startHeartRain();
        }
        counterElement.innerText = currentDay;
      }, 30);
    }

    // 2. Hàm tạo hiệu ứng tim rơi
    function startHeartRain() {
      const container = document.querySelector('.container');
      const heartIcons = ['❤️', '💖', '💕', '🌸', '✨'];

      heartInterval = setInterval(() => {
        const heart = document.createElement('div');
        heart.classList.add('heart-particle');
        heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
        
        heart.style.left = Math.random() * 90 + '%';
        heart.style.animationDuration = (Math.random() * 3 + 2.5) + 's';
        heart.style.fontSize = (Math.random() * 12 + 16) + 'px';

        container.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 5500);
      }, 300);
    }
  </script>
</body>
</html>
