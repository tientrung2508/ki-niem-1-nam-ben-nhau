<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kỷ Niệm 1 Năm Bên Nhau ❤️</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@300;400;600&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050508;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #fff;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 720px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px 20px;
    }

    /* Bức ảnh trình chiếu */
    .bg-image-wrapper {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
    }

    .bg-image {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.5s ease-in-out, transform 6s ease-in-out;
      transform: scale(1);
    }

    .bg-image.active {
      opacity: 0.88;
      transform: scale(1.1);
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.75) 100%);
      z-index: 2;
    }

    /* Nội dung đếm ngày và thông điệp */
    .content-box {
      position: relative;
      z-index: 10;
      text-align: center;
      margin-top: 25px;
      width: 100%;
    }

    .counter-number {
      font-size: 3.8rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 4px 15px rgba(0,0,0,0.8), 0 0 20px rgba(255,182,193,0.6);
    }

    .counter-label {
      font-size: 1rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ffe0e6;
      margin-bottom: 10px;
    }

    .message-text {
      font-family: 'Dancing Script', cursive;
      font-size: 1.8rem;
      color: #ffccd5;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      min-height: 80px;
      padding: 0 10px;
      line-height: 1.4;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .message-text.show {
      opacity: 1;
    }

    /* Controls */
    .controls-area {
      position: relative;
      z-index: 10;
      width: 100%;
      text-align: center;
      margin-bottom: 10px;
    }

    .start-btn {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      color: #fff;
      padding: 14px 32px;
      font-size: 1rem;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      transition: all 0.4s;
      font-family: 'Montserrat', sans-serif;
    }

    .start-btn:hover {
      background: rgba(255, 255, 255, 0.45);
      transform: scale(1.05);
    }

    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin-top: 15px;
      overflow: hidden;
      display: none;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #ff4d6d;
      transition: width 0.3s linear;
    }

    /* Trái tim rơi */
    .heart-particle {
      position: absolute;
      top: -30px;
      color: #ff4d6d;
      font-size: 20px;
      z-index: 5;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(750px) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="bg-image-wrapper">
      <img src="IMG_2288.png" class="bg-image active" id="img0" alt="Kỷ niệm">
      <img src="IMG_2294.jpeg" class="bg-image" id="img1" alt="Kỷ niệm" onerror="this.src='IMG_2294.JPEG'">
      <img src="IMG_2295.jpeg" class="bg-image" id="img2" alt="Kỷ niệm" onerror="this.src='IMG_2295.JPEG'">
      <img src="IMG_2296.jpeg" class="bg-image" id="img3" alt="Kỷ niệm" onerror="this.src='IMG_2296.JPEG'">
      <img src="IMG_2297.jpeg" class="bg-image" id="img4" alt="Kỷ niệm" onerror="this.src='IMG_2297.JPEG'">
      <img src="IMG_2298.jpeg" class="bg-image" id="img5" alt="Kỷ niệm" onerror="this.src='IMG_2298.JPEG'">
      <img src="IMG_2299.jpeg" class="bg-image" id="img6" alt="Kỷ niệm" onerror="this.src='IMG_2299.JPEG'">
    </div>
    <div class="overlay"></div>

    <div class="content-box">
      <div class="counter-box" id="counterBox">
        <div class="counter-number" id="dayCounter">0</div>
        <div class="counter-label">NGÀY BÊN NHAU</div>
      </div>
      <div class="message-text" id="finalMessage"></div>
    </div>

    <div class="controls-area">
      <button class="start-btn" id="startBtn" onclick="startStory()">Chạm để bắt đầu ✨</button>
      <div class="progress-bar-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
  </div>

  <audio id="bgMusic" src="Ed Sheeran - Photograph (Lyrics) - 7clouds.mp3"></audio>

  <script>
    const messages = [
      "Thế là tròn 1 năm 2 đứa bên nhau.. ❤️",
      "Những bữa ăn ngon, những nụ cười giòn 🍲✨",
      "Bên em, ngày bình thường cũng thật ấm áp 🐱💕",
      "Cùng em nhí nhố qua từng khoảnh khắc 😊🌸",
      "Mỗi con đường mình cùng bước qua 🌹🌿",
      "Mỗi nụ cười trao nhau là một niềm hạnh phúc ✨",
      "Cảm ơn em đã cùng anh đi qua 365 ngày tuyệt vời! Yêu em thật nhiều ❤️"
    ];

    let currentIndex = 0;
    const totalImages = 7;
    let slideInterval;

    function startStory() {
      const btn = document.getElementById('startBtn');
      const music = document.getElementById('bgMusic');
      const progressContainer = document.getElementById('progressContainer');

      // Phát nhạc
      music.play().catch(e => console.log("Lỗi phát nhạc:", e));
      
      btn.style.display = 'none';
      progressContainer.style.display = 'block';

      // 1. Hiệu ứng đếm số ngày
      let currentDay = 0;
      const counterElement = document.getElementById('dayCounter');
      const messageElement = document.getElementById('finalMessage');

      const counterInterval = setInterval(() => {
        currentDay += 5;
        if (currentDay >= 365) {
          currentDay = 365;
          clearInterval(counterInterval);

          messageElement.innerText = messages[0];
          messageElement.classList.add('show');
          startHeartRain();

          // 2. Bắt đầu tự động chuyển ảnh mỗi 5.5 giây
          startSlideshow();
        }
        counterElement.innerText = currentDay;
      }, 30);

      // Cập nhật thanh thời lượng nhạc
      music.ontimeupdate = () => {
        const bar = document.getElementById('progressBar');
        if (music.duration) {
          bar.style.width = (music.currentTime / music.duration * 100) + '%';
        }
      };
    }

    function startSlideshow() {
      // Tự động chuyển hình tiếp theo sau mỗi 5.5s độc lập
      slideInterval = setInterval(() => {
        currentIndex = (currentIndex + 1) % totalImages;
        changeStage(currentIndex);
      }, 5500);
    }

    function changeStage(index) {
      const images = document.querySelectorAll('.bg-image');
      images.forEach((img, i) => {
        img.classList.toggle('active', i === index);
      });

      const messageElement = document.getElementById('finalMessage');
      messageElement.classList.remove('show');
      
      setTimeout(() => {
        messageElement.innerText = messages[index] || messages[0];
        messageElement.classList.add('show');
      }, 400);
    }

    function startHeartRain() {
      const container = document.querySelector('.container');
      const heartIcons = ['❤️', '💖', '💕', '🌸', '✨'];

      setInterval(() => {
        const heart = document.createElement('div');
        heart.classList.add('heart-particle');
        heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
        heart.style.left = Math.random() * 90 + '%';
        heart.style.animationDuration = (Math.random() * 3 + 2.5) + 's';
        heart.style.fontSize = (Math.random() * 10 + 16) + 'px';

        container.appendChild(heart);
        setTimeout(() => heart.remove(), 5500);
      }, 350);
    }
  </script>
</body>
</html>
